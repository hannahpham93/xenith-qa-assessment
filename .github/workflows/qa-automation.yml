name: Bookstore QA Automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repo and upload artifacts.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-automation:
    name: Playwright (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-automation/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          BASE_URL: https://demoqa.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web-automation/playwright-report/
          retention-days: 7

  api-automation:
    name: Karate (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn test
        env:
          BASE_URL: https://demoqa.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports
          path: api-automation/target/karate-reports/
          retention-days: 7
